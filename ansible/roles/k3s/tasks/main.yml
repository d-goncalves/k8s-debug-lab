---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Install k3s
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_bin.stat.exists

- name: Wait for the node to be Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  retries: 3
  delay: 10
  register: node_ready
  until: node_ready.rc == 0

- name: Wait for Traefik to be rolled out
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system rollout status deploy/traefik --timeout=180s
  changed_when: false
  retries: 5
  delay: 15
  register: traefik_ready
  until: traefik_ready.rc == 0

- name: Symlink kubectl and crictl onto PATH (also for sudo secure_path)
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "{{ item }}"
    state: link
  loop:
    - /usr/bin/kubectl
    - /usr/local/bin/kubectl

- name: Export KUBECONFIG for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/k3s.sh
    mode: "0644"
    content: |
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
