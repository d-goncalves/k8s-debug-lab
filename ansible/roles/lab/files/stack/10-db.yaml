apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: ch4nge-me-in-real-life
  POSTGRES_DB: demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          envFrom:
            - secretRef: {name: db-credentials}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "demo"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: db-data}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo
spec:
  selector: {app: db}
  ports:
    - {port: 5432, targetPort: postgres}
