apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: demo
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        default_type text/plain;
        return 200 'demo api ok\n';
      }
      location /healthz {
        default_type text/plain;
        return 200 'ok\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z db.demo.svc.cluster.local 5432; do echo waiting for db; sleep 2; done; echo db reachable'
      containers:
        - name: api
          image: nginx:1.29-alpine
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: config
          configMap: {name: api-config}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
spec:
  selector: {app: api}
  ports:
    - {port: 80, targetPort: http}
