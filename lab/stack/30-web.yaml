apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: demo
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        default_type text/plain;
        return 200 'demo web is serving\n';
      }
      location /healthz {
        default_type text/plain;
        return 200 'ok\n';
      }
      location /api/ {
        proxy_pass http://api.demo.svc.cluster.local:80/;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: config
          configMap: {name: web-config}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - {port: 80, targetPort: http}
